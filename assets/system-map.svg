<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-label="System map: one question through six steps, guard, classify, route, retrieve, select, validate, and the three locks that own them.">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f1216"/><stop offset="100%" stop-color="#171b21"/></linearGradient></defs>
<rect width="1200" height="1000" fill="url(#bg)"/>
<rect x="0" y="0" width="7" height="1000" fill="#7f9bb8"/>
<text x="60" y="58" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" font-weight="700" letter-spacing="3" fill="#7f9bb8">SYSTEM MAP</text>
<text x="60" y="104" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="40" font-weight="700" fill="#e6e8eb">One question, three locks</text>
<text x="60" y="140" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="23" fill="#8b929c">A question reaches the table only when every lock in front of it says yes.</text>
<rect x="720" y="36" width="420" height="52" rx="8" fill="none" stroke="#2b3138"/>
<text x="930" y="69" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" fill="#e6e8eb">6 steps  3 locks  4 patterns</text>
<text x="60" y="196" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" font-weight="700" letter-spacing="2" fill="#7f9bb8">01  THE PATH</text>
<text x="230" y="196" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#8b929c">top to bottom, the order a question meets them</text>
<rect x="60" y="216" width="533" height="100" rx="10" fill="#1a1f26" fill-opacity=".92" stroke="#2b3138"/>
<rect x="60" y="216" width="5" height="100" rx="2.5" fill="#b5654a" fill-opacity="1"/>
<text x="78" y="250" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#e6e8eb">Guard</text>
<text x="78" y="278" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#8b929c">seven phrases refused on the way in</text>
<text x="78" y="304" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" fill="#b5654a">guardrails/prompt_injection_guard.py</text>
<rect x="607" y="216" width="533" height="100" rx="10" fill="#1a1f26" fill-opacity=".92" stroke="#2b3138"/>
<rect x="607" y="216" width="5" height="100" rx="2.5" fill="#7f9bb8" fill-opacity="0.6"/>
<text x="625" y="250" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#e6e8eb">Classify</text>
<text x="625" y="278" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#8b929c">two vocabularies, whole words, no model</text>
<text x="625" y="304" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" fill="#8b929c">app/intent_classifier.py</text>
<rect x="60" y="330" width="533" height="100" rx="10" fill="#1a1f26" fill-opacity=".92" stroke="#2b3138"/>
<rect x="60" y="330" width="5" height="100" rx="2.5" fill="#7f9bb8" fill-opacity="0.6"/>
<text x="78" y="364" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#e6e8eb">Route</text>
<text x="78" y="392" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#8b929c">a strict winner routes, a tie asks again</text>
<text x="78" y="418" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" fill="#8b929c">app/router.py</text>
<rect x="607" y="330" width="533" height="100" rx="10" fill="#1a1f26" fill-opacity=".92" stroke="#2b3138"/>
<rect x="607" y="330" width="5" height="100" rx="2.5" fill="#7f9bb8" fill-opacity="0.6"/>
<text x="625" y="364" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#e6e8eb">Retrieve</text>
<text x="625" y="392" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#8b929c">FAISS over the guide, top two paragraphs</text>
<text x="625" y="418" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" fill="#8b929c">app/chains.py</text>
<rect x="60" y="444" width="533" height="100" rx="10" fill="#1a1f26" fill-opacity=".92" stroke="#2b3138"/>
<rect x="60" y="444" width="5" height="100" rx="2.5" fill="#7f9bb8" fill-opacity="0.6"/>
<text x="78" y="478" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#e6e8eb">Select</text>
<text x="78" y="506" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#8b929c">SQL chosen from a four-column map</text>
<text x="78" y="532" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" fill="#8b929c">app/contract_agent.py</text>
<rect x="607" y="444" width="533" height="100" rx="10" fill="#1a1f26" fill-opacity=".92" stroke="#2b3138"/>
<rect x="607" y="444" width="5" height="100" rx="2.5" fill="#b5654a" fill-opacity="1"/>
<text x="625" y="478" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#e6e8eb">Validate</text>
<text x="625" y="506" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#8b929c">one SELECT, one table, four columns</text>
<text x="625" y="532" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" fill="#b5654a">guardrails/sql_validator.py</text>
<text x="60" y="592" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" font-weight="700" letter-spacing="2" fill="#7f9bb8">02  WHO OWNS THE LOCK</text>
<text x="370" y="592" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#8b929c">each lock answers to its own source of truth</text>
<rect x="60" y="612" width="352" height="150" rx="10" fill="#1a1f26" fill-opacity=".92" stroke="#2b3138"/>
<rect x="60" y="612" width="5" height="150" rx="2.5" fill="#7f9bb8" fill-opacity=".6"/>
<text x="78" y="648" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="24" font-weight="700" letter-spacing="2" fill="#7f9bb8">ROUTE</text>
<text x="78" y="682" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#e6e8eb">the column map&#x27;s own words</text>
<text x="78" y="714" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#e6e8eb">plus billing, one stemmer</text>
<text x="78" y="746" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#e6e8eb">a tie asks the user again</text>
<rect x="426" y="612" width="352" height="150" rx="10" fill="#1a1f26" fill-opacity=".92" stroke="#2b3138"/>
<rect x="426" y="612" width="5" height="150" rx="2.5" fill="#7f9bb8" fill-opacity=".6"/>
<text x="444" y="648" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="24" font-weight="700" letter-spacing="2" fill="#7f9bb8">CONSTRAIN</text>
<text x="444" y="682" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#e6e8eb">user words never reach SQL</text>
<text x="444" y="714" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#e6e8eb">allowlist, then denylist</text>
<text x="444" y="746" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#e6e8eb">the only lock in Phase 2</text>
<rect x="792" y="612" width="352" height="150" rx="10" fill="#1a1f26" fill-opacity=".92" stroke="#2b3138"/>
<rect x="792" y="612" width="5" height="150" rx="2.5" fill="#7f9bb8" fill-opacity=".6"/>
<text x="810" y="648" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="24" font-weight="700" letter-spacing="2" fill="#7f9bb8">REDACT</text>
<text x="810" y="682" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#e6e8eb">four patterns, output side</text>
<text x="810" y="714" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#e6e8eb">SSN, email, phone, card</text>
<text x="810" y="746" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#e6e8eb">dashed phones slip through</text>
<text x="60" y="822" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" font-weight="700" letter-spacing="2" fill="#7f9bb8">03  THE STAGED PATH</text>
<text x="340" y="822" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#8b929c">what runs here, and what is only designed</text>
<rect x="60" y="842" width="352" height="92" rx="10" fill="#1a1f26" fill-opacity="1" stroke="#7f9bb8"/>
<text x="78" y="878" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#7f9bb8">Pilot</text>
<text x="78" y="910" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#e6e8eb">runs and is measured here</text>
<rect x="426" y="842" width="352" height="92" rx="10" fill="#1a1f26" fill-opacity="0.92" stroke="#2b3138"/>
<text x="444" y="878" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#e6e8eb">Production</text>
<text x="444" y="910" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#8b929c">a model behind the locks</text>
<rect x="792" y="842" width="352" height="92" rx="10" fill="#1a1f26" fill-opacity="0.92" stroke="#2b3138"/>
<text x="810" y="878" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#e6e8eb">Scaling</text>
<text x="810" y="910" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#8b929c">Helm and Argo manifests</text>
<text x="600.0" y="986" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" fill="#8b929c">python3 tools/render_map.py --check   regenerates and compares this figure in CI</text>
</svg>
