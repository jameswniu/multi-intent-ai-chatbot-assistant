<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-label="Docs, or the database? Three locks on one question, each with its own source of truth.">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f1216"/><stop offset="100%" stop-color="#171b21"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e6e8eb" stroke-opacity=".045" stroke-width="1"/></pattern></defs>
<rect width="1200" height="460" fill="url(#bg)"/>
<rect width="1200" height="460" fill="url(#grid)"/>
<rect x="0" y="0" width="1200" height="3" fill="#7f9bb8"/>
<text x="600.0" y="76" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="50" font-weight="700" fill="#e6e8eb">Docs, or the database?</text>
<text x="600.0" y="118" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="27" fill="#8b929c">Three locks on one question, each with its own source of truth.</text>
<rect x="40" y="150" width="360" height="242" rx="12" fill="#1a1f26" fill-opacity=".92" stroke="#2b3138"/>
<rect x="40" y="150" width="7" height="242" rx="3.5" fill="#7f9bb8" fill-opacity=".6"/>
<text x="220.0" y="192" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="24" font-weight="700" letter-spacing="2" fill="#7f9bb8">ROUTE</text>
<text x="220.0" y="234" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="25" font-weight="700" fill="#e6e8eb">Which agent answers,</text>
<text x="220.0" y="264" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="25" font-weight="700" fill="#e6e8eb">or ask the user?</text>
<text x="220.0" y="306" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" letter-spacing="1.5" fill="#8b929c">SOURCE OF TRUTH</text>
<text x="220.0" y="338" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#e6e8eb">the column map</text>
<text x="220.0" y="372" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" fill="#8b929c">changes with the schema</text>
<rect x="420" y="150" width="360" height="242" rx="12" fill="#1a1f26" fill-opacity=".92" stroke="#2b3138"/>
<rect x="420" y="150" width="7" height="242" rx="3.5" fill="#7f9bb8" fill-opacity=".6"/>
<text x="600.0" y="192" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="24" font-weight="700" letter-spacing="2" fill="#7f9bb8">CONSTRAIN</text>
<text x="600.0" y="234" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="25" font-weight="700" fill="#e6e8eb">What SQL may run</text>
<text x="600.0" y="264" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="25" font-weight="700" fill="#e6e8eb">against the table?</text>
<text x="600.0" y="306" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" letter-spacing="1.5" fill="#8b929c">SOURCE OF TRUTH</text>
<text x="600.0" y="338" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#e6e8eb">a four-column map</text>
<text x="600.0" y="372" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" fill="#8b929c">Phase 2 swaps in a model</text>
<rect x="800" y="150" width="360" height="242" rx="12" fill="#1a1f26" fill-opacity=".92" stroke="#2b3138"/>
<rect x="800" y="150" width="7" height="242" rx="3.5" fill="#7f9bb8" fill-opacity=".6"/>
<text x="980.0" y="192" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="24" font-weight="700" letter-spacing="2" fill="#7f9bb8">REDACT</text>
<text x="980.0" y="234" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="25" font-weight="700" fill="#e6e8eb">What may leave</text>
<text x="980.0" y="264" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="25" font-weight="700" fill="#e6e8eb">in the answer?</text>
<text x="980.0" y="306" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" letter-spacing="1.5" fill="#8b929c">SOURCE OF TRUTH</text>
<text x="980.0" y="338" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#e6e8eb">four regex patterns</text>
<text x="980.0" y="372" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" fill="#8b929c">read on the way out</text>
<text x="600.0" y="432" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" fill="#8b929c">guard then classify then route then select then validate then redact</text>
</svg>
