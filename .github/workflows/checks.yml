# Runs the repo's own claims against the repo.
#
# Every number on the landing page is recomputed here by running the Phase 1
# pilot against the labelled cases, and the build fails if a badge, the report,
# or a committed figure has drifted from what the code actually does. A count
# nobody re-runs decays into a number somebody typed.
name: checks

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # The retrieval model is fetched once and kept, so a run does not depend on
      # the model hub being up.
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pytest

      - name: Test suite
        run: python -m pytest tests/ -v

      - name: Recount every number on the page
        run: python3 evals/score.py --check

      - name: Figures match their generators
        run: |
          python3 tools/render_hero.py --check
          python3 tools/render_map.py --check
